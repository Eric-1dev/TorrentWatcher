services:
  torrentwatcher:
    build:
      context: .
      dockerfile: Dockerfile
    image: torrentwatcher:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      TZ: Europe/Moscow
      ConnectionStrings__Default: "Data Source=/data/torrentwatcher.db"
      Storage__TorrentsDirectory: "/data/torrents"
    volumes:
      - ./data:/data
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - --show-error
        - http://127.0.0.1:8080/api/health
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
